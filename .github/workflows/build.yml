name: Build Native APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Pure Native App
        run: |
          # 1. クリーンなFlutterプロジェクトを新規構築
          rm -rf build_temp
          flutter create --org com.app.native --project-name native_web_app build_temp
          
          # 2. 必要なプラグインを追加 (WebView/ネットワーク/マテリアル)
          cd build_temp
          flutter pub add webview_flutter flutter_inappwebview url_launcher || true
          
          # 3. リポジトリ内の main.dart があればそれを適用、なければ自動生成
          if [ -f "../lib/main.dart" ]; then
            cp ../lib/main.dart lib/main.dart
          fi

          # 4. APKをビルド
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build_temp/build/app/outputs/flutter-apk/app-release.apk
