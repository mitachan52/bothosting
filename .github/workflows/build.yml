name: Build 100% Native Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-native-apk:
    name: Compile Pure Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Standalone Release APK (Universal)
        run: flutter build apk --release --split-per-abi=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
